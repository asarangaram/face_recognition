

services:
  web:
    build: .
    restart: always  # Add this line
    volumes:
      - ./app:/app
      - uwsgi_sock:/tmp/sockets
    command: uwsgi --ini /app/uwsgi.ini

  nginx:
    image: nginx:1.21-alpine
    restart: always  # Add this line
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - uwsgi_sock:/tmp/sockets
    ports:
      - "5002:80"
    depends_on:
      - web

volumes:
  uwsgi_sock: